[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawkit"
dynamic = ["version"]
description = "Local-first social media content extractor for Douyin, Xiaohongshu, Bilibili, Weibo, and more"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JoeyZ1105" }]
keywords = [
    "social-media",
    "scraper",
    "extractor",
    "douyin",
    "tiktok",
    "xiaohongshu",
    "bilibili",
    "weibo",
    "zhihu",
    "kuaishou",
    "youtube",
    "twitter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
auth = ["playwright>=1.40"]
video = ["yt-dlp>=2024.0.0"]
analyze = ["google-genai"]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/JoeyZ1105/clawkit"
Repository = "https://github.com/JoeyZ1105/clawkit"
Issues = "https://github.com/JoeyZ1105/clawkit/issues"
Changelog = "https://github.com/JoeyZ1105/clawkit/blob/main/CHANGELOG.md"

[project.scripts]
clawkit = "clawkit.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "clawkit.__version__" }

[tool.setuptools.packages.find]
include = ["clawkit*"]
