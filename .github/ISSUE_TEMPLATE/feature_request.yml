name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem would this feature solve?
      placeholder: I'm trying to... but currently...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches?

  - type: dropdown
    id: platform
    attributes:
      label: Related Platform (if any)
      options:
        - N/A - General
        - Douyin (抖音)
        - Xiaohongshu (小红书)
        - Bilibili (B站)
        - Weibo (微博)
        - Zhihu (知乎)
        - Kuaishou (快手)
        - YouTube
        - Twitter/X
        - GooFish (闲鱼)
        - New Platform Request
